<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Lista de tareas</h1>

    <form id="task-form" class="task-form" autocomplete="off">
      <label for="task-input" class="sr-only">Nueva tarea</label>
      <input type="text" id="task-input" placeholder="¿Qué necesitas hacer?" maxlength="200" required>
      <button type="submit">Agregar</button>
    </form>

    <p id="empty-message" class="empty-message" hidden>No hay tareas. ¡Agrega una!</p>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="counter"></span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
